# Runs on every push and pull request. Tests that need the raw DEM tiles (data_raw/, not in git)
# skip themselves here; run `python -m pytest preprocess` on a machine with the tiles for those.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: preprocess/requirements*.txt
      - run: pip install -r preprocess/requirements-c.txt
      - run: python -m pytest preprocess -q -rs
